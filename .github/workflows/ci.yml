name: SQL checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python analyze.py
      - run: diff -r reports/csv build --exclude=sports.sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: sql-results
          path: build/
